[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
nguonc-core = { path = "core" }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time"] }
url = "2"
