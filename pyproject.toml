[project]
name = "nguonc-downloader"
version = "0.1.0"
description = "Cross-platform desktop app that downloads movies from phim.nguonc.com"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pin: flet build installs project.dependencies into the bundle
    # (ignores uv.lock); loose ranges pull flet 1.x while source runs 0.86.5.
    "flet==0.86.5",
    "yt-dlp",
    "cryptography",
    "httpx[http2]",
]

[dependency-groups]
dev = [
    "flet-cli",
    "pyinstaller",
]

[tool.flet]
app.module = "nguonc_app"
product = "NguonC Downloader"
description = "Cross-platform desktop app that downloads movies from phim.nguonc.com"

[tool.flet.macos]
org = "com.nguonc.downloader"
